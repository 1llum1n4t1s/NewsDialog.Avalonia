version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/NewsDialog.Avalonia"
      - "/samples/NewsDemoApp"
      - "/tests/NewsDialog.Avalonia.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
