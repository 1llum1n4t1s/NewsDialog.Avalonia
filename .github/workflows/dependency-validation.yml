name: Dependency validation

# .NET アプリ本体の restore・build・既存回帰テストを、main への push と全 PR
# （Dependabot を含む）と手動実行で通す。配信 workflow は無い。
# 公開リポジトリなので GitHub 提供ランナーで動かす。Worker publisher は publisher-tests.yml が担当。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# PR は古い実行を取り消す。main への push は各コミットの結果を残す。
concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
      - name: Restore
        run: |
          dotnet restore NewsDialog.Avalonia.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build NewsDialog.Avalonia.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test --solution NewsDialog.Avalonia.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
